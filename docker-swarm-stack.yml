version: '3.8'

# Production Docker Swarm Stack for AI Ecosystem
# Deploy: docker stack deploy -c docker-swarm-stack.yml ai_ecosystem

networks:
  gpu_net:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 9000  # Jumbo frames for 2.5G
  cpu_net:
    driver: overlay
    attachable: true

volumes:
  model_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/models  # Desktop NVMe mount
  data_processing:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP},nolock,soft,rw,vers=4.2"
      device: ":/data"
  obsidian_vault:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP},nolock,soft,rw,vers=4.2"
      device: ":/obsidian"
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  mlflow_artifacts:
    driver: local

services:
  # ============================================
  # GPU-Exclusive Services (Desktop Manager Node)
  # ============================================
  
  nim_inference:
    image: nvcr.io/nim/meta/llama-3.1-8b-instruct:latest
    hostname: nim-inference
    networks:
      - gpu_net
    volumes:
      - model_storage:/models:ro
      - /tmp/nim_cache:/tmp/nim_cache
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu==true
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
          memory: 16G
        limits:
          memory: 32G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NIM_MODEL_PATH=/models/llama-3.1-8b
      - NIM_TENSOR_PARALLEL_SIZE=1
      - NIM_MAX_BATCH_SIZE=128
      - NIM_USE_PAGED_ATTENTION=true
      - NIM_ENABLE_METRICS=true
      - NGC_API_KEY=${NGC_API_KEY}
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host  # Host networking for lowest latency
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  triton_server:
    image: nvcr.io/nvidia/tritonserver:24.12-py3
    hostname: triton-server
    networks:
      - gpu_net
    volumes:
      - model_storage:/models:ro
      - ./triton_configs:/configs:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu==true
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
          memory: 8G
        limits:
          memory: 20G
      restart_policy:
        condition: on-failure
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc.so.4  # Memory optimization
    ports:
      - "8001:8001"  # gRPC
      - "8002:8002"  # REST
      - "8003:8003"  # Metrics
    command: >
      tritonserver
      --model-repository=/models
      --strict-model-config=false
      --backend-config=tensorflow,version=2
      --http-port=8002
      --grpc-port=8001
      --metrics-port=8003
      --log-verbose=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/v2/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  nemo_training:
    image: nvcr.io/nvidia/nemo:24.12
    hostname: nemo-training
    networks:
      - gpu_net
    volumes:
      - model_storage:/workspace
      - data_processing:/data:ro
      - ./nemo_scripts:/scripts:ro
    deploy:
      mode: replicated
      replicas: 0  # Scale on-demand via: docker service scale ai_ecosystem_nemo_training=1
      placement:
        constraints:
          - node.labels.gpu==true
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
          memory: 32G
        limits:
          memory: 80G  # Allow use of 128GB DDR5 for data caching
      restart_policy:
        condition: none  # Job-based, don't auto-restart
    environment:
      - NEMO_EXPM_VERSION=24.12
      - HYDRA_FULL_ERROR=1
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - NGC_API_KEY=${NGC_API_KEY}
    command: sleep infinity  # Override with exec for specific jobs

  tensorrt_optimizer:
    image: nvcr.io/nvidia/tensorrt:24.12-py3
    hostname: tensorrt-optimizer
    networks:
      - gpu_net
    volumes:
      - model_storage:/workspace
      - ./trt_scripts:/scripts:ro
    deploy:
      mode: replicated
      replicas: 0  # On-demand
      placement:
        constraints:
          - node.labels.gpu==true
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
          memory: 16G
        limits:
          memory: 40G
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: sleep infinity

  trex_classifier:
    image: python:3.11-slim
    hostname: trex-api
    networks:
      - gpu_net
    volumes:
      - model_storage:/models:ro
      - ./trex_api:/app:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu==true
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      restart_policy:
        condition: on-failure
    working_dir: /app
    command: >
      bash -c "pip install flask transformers torch tritonclient[http] &&
               python trex_api.py"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis_cache:
    image: redis:7-alpine
    hostname: redis-cache
    networks:
      - gpu_net
      - cpu_net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu==true  # Co-locate with GPU for low latency
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
      restart_policy:
        condition: any
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================
  # CPU-Offload Services (XPS 15 Worker Node)
  # ============================================

  n8n_automation:
    image: n8nio/n8n:latest
    hostname: n8n-automation
    networks:
      - cpu_net
    volumes:
      - /mnt/n8n:/home/node/.n8n
      - obsidian_vault:/obsidian
      - ./n8n_workflows:/workflows:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cpu==true
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${DESKTOP_IP}:5678
      - GENERIC_TIMEZONE=America/New_York
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 1 week
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres_mlops:
    image: postgres:16-alpine
    hostname: postgres-mlops
    networks:
      - cpu_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cpu==true
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      restart_policy:
        condition: any
    environment:
      - POSTGRES_DB=mlops
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c max_connections=100

  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    hostname: mlflow-server
    networks:
      - cpu_net
    volumes:
      - mlflow_artifacts:/mlflow
    depends_on:
      - postgres_mlops
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cpu==true
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      restart_policy:
        condition: on-failure
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${DB_USER}:${DB_PASSWORD}@postgres_mlops:5432/mlops
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@postgres_mlops:5432/mlops
      --default-artifact-root /mlflow
      --host 0.0.0.0
      --port 5000
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  data_preprocessing:
    image: python:3.11-slim
    hostname: data-preprocessing
    networks:
      - cpu_net
    volumes:
      - data_processing:/data
      - ./preprocessing_scripts:/scripts:ro
    deploy:
      mode: replicated
      replicas: 0  # Job-based
      placement:
        constraints:
          - node.labels.cpu==true
      resources:
        limits:
          cpus: '12.0'  # Utilize XPS 15's full CPU
          memory: 48G   # 64GB RAM - leave room for OS
      restart_policy:
        condition: none
    command: sleep infinity

  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    networks:
      - cpu_net
      - gpu_net
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cpu==true
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: any
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    networks:
      - cpu_net
    volumes:
      - /mnt/grafana:/var/lib/grafana
      - ./grafana_dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cpu==true
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: any
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"

  dcgm_exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    hostname: dcgm-exporter
    networks:
      - gpu_net
    deploy:
      mode: global  # Run on all GPU nodes
      placement:
        constraints:
          - node.labels.gpu==true
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
        limits:
          memory: 256M
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    ports:
      - "9400:9400"
    cap_add:
      - SYS_ADMIN

# ============================================
# Configs
# ============================================
configs:
  prometheus_config:
    file: ./prometheus.yml
  triton_model_config:
    file: ./triton_configs/config.pbtxt

# ============================================
# Secrets (use Docker secrets in production)
# ============================================
secrets:
  ngc_api_key:
    external: true
  db_password:
    external: true
