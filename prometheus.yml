# Prometheus Configuration for AI Ecosystem Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai_ecosystem'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # ============================================
  # GPU Metrics (DCGM Exporter)
  # ============================================
  - job_name: 'gpu_metrics'
    static_configs:
      - targets: ['dcgm_exporter:9400']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'desktop_rtx5070ti'

  # ============================================
  # NIM Inference Server
  # ============================================
  - job_name: 'nim_inference'
    static_configs:
      - targets: ['nim_inference:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ============================================
  # Triton Inference Server
  # ============================================
  - job_name: 'triton_server'
    static_configs:
      - targets: ['triton_server:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ============================================
  # Redis Cache
  # ============================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_cache:6379']
    # Requires redis_exporter sidecar
    # metrics_path: '/metrics'

  # ============================================
  # PostgreSQL
  # ============================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_mlops:5432']
    # Requires postgres_exporter sidecar
    # metrics_path: '/metrics'

  # ============================================
  # MLflow Server
  # ============================================
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow_server:5000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ============================================
  # n8n Automation
  # ============================================
  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n_automation:5678']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ============================================
  # Node Exporter (System Metrics)
  # ============================================
  - job_name: 'node_exporter_desktop'
    static_configs:
      - targets: ['${DESKTOP_IP}:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'desktop'

  - job_name: 'node_exporter_xps15'
    static_configs:
      - targets: ['${XPS15_IP}:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'xps15'

  # ============================================
  # Docker Swarm Metrics (cAdvisor)
  # ============================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['${DESKTOP_IP}:8080', '${XPS15_IP}:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ============================================
  # Prometheus Self-Monitoring
  # ============================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
